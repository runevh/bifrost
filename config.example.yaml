bifrost:
  # Override the default path to the one used in the docker image
  cert_file: "certs/cert.pem"

bridge:
  name: Bifrost
  mac: 00:11:22:33:44:55
  ipaddress: 10.12.0.20
  netmask: 255.255.255.0
  gateway: 10.12.0.1
  timezone: Europe/Copenhagen

z2m:
  server1:
    url: ws://10.0.0.100:8080

homeassistant:
  url: http://homeassistant.local:8123
  token: YOUR_LONG_LIVED_ACCESS_TOKEN
  # Optional fade duration for light updates sent to Home Assistant
  # (applies to on/off, brightness, color and color-temperature writes).
  transition_ms: 350
  # Optional buffer window for coalescing bursty light updates (e.g. scenes)
  # into one backend flush batch.
  light_update_buffer_ms: 80
