name: Home Assistant Add-on

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/addon-publish.yml"
      - "addon/bifrost/**"
      - "crates/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ADDON_SLUG: bifrost

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        run: |
          version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' addon/bifrost/config.yaml)"
          if [ -z "${version}" ]; then
            echo "Unable to read add-on version" >&2
            exit 1
          fi
          echo "ADDON_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build and push add-on image
        uses: docker/build-push-action@v6
        with:
          context: addon/bifrost
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BIFROST_REPOSITORY=https://github.com/${{ github.repository }}.git
            BIFROST_REF=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.arch }}-addon-${{ env.ADDON_SLUG }}:${{ env.ADDON_VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.arch }}-addon-${{ env.ADDON_SLUG }}:latest
          cache-from: type=gha,scope=addon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}
